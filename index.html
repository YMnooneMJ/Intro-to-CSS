<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- linking external css to index.html file (any web page or Document) -->
    <link rel="stylesheet" href="./index.css" />
    <title>Document</title>

    <!-- internal styling with CSS -->
    <style>
        /* styling will apply to all h2 tags */
      h2 {
        color: black;
        font-family: 'Courier New', Courier, monospace
        font-size: 30px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <!-- inline styling with CSS -->
      <h2>I will win at all cost</h2>
      <h2>Watch me win, alright!</h2>
      <h1
        style="
          color: black;
          font-family: Impact, Haettenschweiler, 'Arial Narrow Bold',
            sans-serif Arial, Helvetica, sans-serif;
        "
      >
        Home
      </h1>
      <p
        style="
          border: 2px;
          border-color: rgb(60, 5, 5);
          border-style: solid;
          color: black;
        "
      >
        this is my home page
      </p>
      <div class="container">
        <div class="child">a</div>
        <p class="child">b</p>
        <h1 class="child">c</h1>
        <div class="child">d</div>
        <div class="child">e</div>
      </div>

      <img src="20241111_145014.jpg" alt="Beautiful" id="profile" />
    </main>
  </body>
</html>
